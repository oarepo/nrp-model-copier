model_name:
  type: str
  help: Short name of the model
  default: datasets
  when: false

model_human_name:
  type: str
  help: Human readable name of the model
  default: "{{model_name|replace('_', '-')|title}}"

model_description:
  type: str
  multiline: true
  help: Description of the model
  default: A generic dataset model

base_model:
  type: str
  help: |
    Pick a base model that will be extended. 
    If unsure, pick complete RDM or CCMM for the Czech National Repository Platform.
    Empty model does not allow to create drafts.
  choices:
    Czech Core Metadata Model: ccmm
    Complete RDM: rdm_complete
    Basic RDM: rdm_basic
    Minimal RDM: rdm_minimal
    Empty model: empty

endpoint:
  type: str
  default: "{{ model_name|slugify }}"
  when: false

languages:
  type: str
  default: ""
  help: "Comma separated list of languages"
  when: false

resource_config:
  type: str
  default: "{{ model_name|to_python_class }}UIResourceConfig"
  help: "Resource configuration"
  when: false

resource:
  type: str
  default: "{{ model_name|to_python_class }}UIResource"
  help: "Resource implementation"
  when: false

_jinja_extensions:
  - copier_templates_extensions.TemplateExtensionLoader
  - extensions/slugify.py:SlugifyExtension
  - extensions/to_python_class.py:ToPythonClassExtension

_templates_suffix: .copier

_subdirectory: template

_exclude:
  - "_variants"

_answers_file: "{{model_name}}/.copier-answers.yml"

_tasks:
  - command:
    - "{{ _copier_python }}"
    - "{{ _copier_conf.src_path }}/extensions/copy_variant.py"
    - "{{base_model}}"
    - "{{model_name}}"
    - "{{ _copier_conf.src_path }}"
  - command:
    - "{{ _copier_python }}"
    - "{{ _copier_conf.src_path }}/extensions/register_to_pyproject.py"
    - "{{model_name}}"
    - "{{base_model}}"
    when: "{{ _copier_operation == 'copy' }}"
  - command:
    - "{{ _copier_python }}"
    - "{{ _copier_conf.src_path }}/extensions/register_to_invenio_cfg.py"
    - "{{model_name}}"
    - "{{endpoint}}"
    when: "{{ _copier_operation == 'copy' }}"